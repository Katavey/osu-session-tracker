<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>osu! session tracker · OBS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font:18px 'Segoe UI',sans-serif}.overlay{margin:16px;width:720px;border-radius:22px;padding:22px;background:rgba(23,19,32,.89);border:1px solid #ffffff20;box-shadow:0 8px 28px #0004}.head{display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:2px;color:#d1bfdc}h1{font-size:16px;margin:0}.dot{color:#9be8c0}.stats{display:flex;justify-content:space-between;margin:18px 4px}.value{font-size:30px;font-weight:750;color:var(--accent,#ff9fc8)}.label,.section-title{font-size:12px;color:#c7b7d2;letter-spacing:1px}.section-title{margin:18px 4px 8px}.card{height:110px;position:relative;border-radius:14px;overflow:hidden;margin-top:8px;background:#261f2e;border-left:5px solid var(--accent,#ff9fc8)}.card.fc{border-left-color:#7ee1ba}.cover{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,18,31,.84),rgba(23,18,31,.53))}.rank{position:absolute;left:14px;top:28px;width:57px;font-size:28px;font-weight:800;color:#9dcbff}.rank.gold{color:#ffd37f}.details{position:absolute;left:86px;right:145px;top:12px}.map{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:700}.meta{display:flex;align-items:center;gap:7px;height:30px;color:#ffcf89;font-size:12px;white-space:nowrap}.mods{display:flex;gap:2px;flex-shrink:0;max-width:115px;overflow:hidden}.mod{width:34px;height:24px;object-fit:contain}.hits{font-size:11px;color:#cfc5d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pp{position:absolute;right:15px;top:24px;text-align:right;color:var(--accent,#ff9fc8);font-size:27px;font-weight:800}.pp small{font-size:14px}.stamp{font-size:11px;color:#cfc5d9;font-weight:400;margin-top:5px}.empty{padding:14px;color:#c7b7d2;font-size:14px}#connection{font-size:11px;color:#cfb9dc;margin-top:8px}.offline{opacity:.55}[hidden]{display:none!important}.enter{animation:enter .28s ease-out}@keyframes enter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.enter{animation:none}}
</style>
<div class="overlay" id="box"><div class="head"><h1>osu! / SESSION TRACKER</h1><span><span class="dot" id="dot">●</span> <span id="time">00:00</span></span></div><div class="stats"><div><div class="value" id="gain">—</div><div class="label" id="gainLabel">PROFILE PP</div></div><div><div class="value" id="fc">0</div><div class="label">FC</div></div><div><div class="value" id="plays">0</div><div class="label" id="playsLabel">PLAYS</div></div><div id="bestStat"><div class="value" id="best">—</div><div class="label" id="bestLabel">BEST PP</div></div></div><section id="bestSection"><div class="section-title" id="bestTag">SESSION BEST</div><div id="bestCard"></div></section><section id="recentSection"><div class="section-title" id="recentTag">RECENT SCORES</div><div id="recentCards"></div></section><div id="connection"></div></div>
<script>
const get=id=>document.getElementById(id),set=(id,v)=>get(id).textContent=v;
let lastBest='',lastRecent='',initialized=false,previousKeys=new Set();
const key=p=>String(p.time)+'|'+String(p.map);
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function image(url,cls){const e=node('img',cls);e.src=url;e.alt='';e.addEventListener('error',()=>{e.hidden=true});return e}
function card(p,animate){
 const e=node('article','card'+(p.fc?' fc':'')+(animate?' enter':''));
 if(/^\/image\/[a-f0-9]{32}$/.test(p.background||''))e.append(image(p.background,'cover'));
 e.append(node('div','shade'),node('div','rank'+(/^[XS]/.test(p.rank||'')?' gold':''),p.rank||'—'));
 const details=node('div','details');details.append(node('div','map',p.map||'—'));
 const meta=node('div','meta'),mods=node('span','mods');
 for(const m of (p.mods||[])){if(/^\/image\/[a-f0-9]{32}$/.test(m.image||'')){const img=image(m.image,'mod');img.alt=m.name;mods.append(img)}else mods.append(node('span','',m.name))}
 meta.append(mods,node('span','',(Number(p.stars)>0?Number(p.stars).toFixed(2)+' ★ · ':'')+Number(p.accuracy||0).toFixed(2)+'% · '+(p.combo||0)+'x'+(p.fc?' · FC':'')));
 details.append(meta,node('div','hits',p.hits||''));e.append(details);
 const pp=node('div','pp',Number(p.pp||0).toFixed(2));pp.append(node('small','',' pp'));
 const date=new Date(p.time);pp.append(node('div','stamp',isNaN(date)?'':date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})));e.append(pp);return e;
}
function render(target,plays,ru,animate){const rows=plays.map(p=>card(p,animate&&!previousKeys.has(key(p))));if(!rows.length)rows.push(node('div','empty',ru?'Ожидание скора…':'Waiting for a score…'));get(target).replaceChildren(...rows)}
async function refresh(){try{
 const response=await fetch('/state',{cache:'no-store'});if(!response.ok)throw Error();const s=await response.json(),ru=s.language==='ru';
 document.documentElement.lang=ru?'ru':'en';get('box').classList.remove('offline');get('box').style.setProperty('--accent',s.accent||'#ff9fc8');get('box').style.fontFamily=s.font||'Segoe UI';
 set('gain',s.gain==null?'—':(s.gain>0?'+':'')+Number(s.gain).toFixed(2));set('fc',s.fc||0);set('plays',s.plays||0);set('best',s.bestPp==null?'—':Number(s.bestPp).toFixed(2));
 set('gainLabel',ru?'PP ПРОФИЛЯ':'PROFILE PP');set('playsLabel',ru?'ПРОХОЖДЕНИЯ':'PLAYS');set('bestLabel',ru?'ЛУЧШИЕ PP':'BEST PP');set('bestTag',ru?'ЛУЧШИЙ СКОР СЕССИИ':'SESSION BEST');set('recentTag',ru?'ПОСЛЕДНИЕ СКОРЫ':'RECENT SCORES');
 get('bestStat').hidden=get('bestSection').hidden=s.showBest===false;get('recentSection').hidden=s.showRecent===false;
 const best=s.best?[s.best]:[],recent=Array.isArray(s.recent)?s.recent.slice(0,5):[],b=JSON.stringify([best,ru]),r=JSON.stringify([recent,ru]);
 if(b!==lastBest){render('bestCard',best,ru,initialized&&s.animate);lastBest=b}if(r!==lastRecent){render('recentCards',recent,ru,initialized&&s.animate);lastRecent=r}
 previousKeys=new Set([...best,...recent].map(key));initialized=true;
 const sec=Math.max(0,Math.floor(s.seconds||0));set('time',[Math.floor(sec/3600),Math.floor(sec/60%60),sec%60].map(n=>String(n).padStart(2,'0')).join(':'));set('dot',s.ended?'■':'●');set('connection',s.ended?(ru?'Сессия завершена':'Session finished'):'');
 }catch{get('box').classList.add('offline');set('connection','Tracker offline / Трекер выключен')}finally{setTimeout(refresh,500)}}refresh();
</script></html>
