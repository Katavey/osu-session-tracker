<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>osu! session tracker · OBS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font:18px 'Segoe UI',sans-serif}.overlay{margin:16px;width:var(--panel-width,720px);border-radius:22px;padding:22px;background:rgba(23,19,32,var(--panel-opacity,.89));border:1px solid #ffffff20;box-shadow:0 8px 28px #0004}.head{display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:2px;color:#d1bfdc}h1{font-size:16px;margin:0}.dot{color:#9be8c0}.stats{display:flex;justify-content:space-between;margin:18px 4px}.value{font-size:30px;font-weight:750;color:var(--accent,#ff9fc8)}.label,.section-title{font-size:12px;color:#c7b7d2;letter-spacing:1px}.section-title{margin:18px 4px 8px}.card{height:var(--card-height,110px);position:relative;border-radius:14px;overflow:hidden;margin-top:8px;background:#261f2e;border-left:5px solid var(--accent,#ff9fc8)}.card.fc{border-left-color:#7ee1ba}.cover{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,18,31,.84),rgba(23,18,31,.53))}.rank{position:absolute;left:14px;top:28px;width:57px;font-size:28px;font-weight:800;color:#9dcbff}.rank.gold{color:#ffd37f}.details{position:absolute;left:86px;right:145px;top:12px}.map{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:700}.meta{display:flex;align-items:center;gap:7px;height:30px;color:#ffcf89;font-size:12px;white-space:nowrap}.mods{display:flex;gap:2px;flex-shrink:0;max-width:115px;overflow:hidden}.mod{width:34px;height:24px;object-fit:contain}.hits{font-size:11px;color:#cfc5d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pp{position:absolute;right:15px;top:24px;text-align:right;color:var(--accent,#ff9fc8);font-size:27px;font-weight:800}.pp small{font-size:14px}.stamp{font-size:11px;color:#cfc5d9;font-weight:400;margin-top:5px}.empty{padding:14px;color:#c7b7d2;font-size:14px}#connection{font-size:11px;color:#cfb9dc;margin-top:8px}.offline{opacity:.55}[hidden]{display:none!important}.enter.slide{animation:enter .28s ease-out}.enter.fade{animation:fade .35s ease-out}.enter.pop{animation:pop .32s ease-out}@keyframes enter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}.compact .hits{display:none}.compact .rank{top:23px}.compact .pp{top:18px}.large .map{font-size:19px}.large .rank{top:42px;font-size:34px}.large .details{top:23px}.large .meta{height:38px;font-size:14px}.large .hits{font-size:13px}.large .pp{top:40px;font-size:32px}@media(prefers-reduced-motion:reduce){.enter{animation:none}}
.section-title{display:flex;align-items:center;gap:9px;letter-spacing:1.4px}.section-title svg{width:16px;height:16px;flex-shrink:0}.best-heading{color:#ffd37f}.recent-heading{color:#8dcbf5}.section-pill{font:700 10px 'Segoe UI',sans-serif;border-radius:7px;padding:4px 7px;letter-spacing:1px}.best-heading .section-pill{background:#ffd37f18}.recent-heading .section-pill{background:#8dcbf518}.score-badge{position:absolute;left:12px;top:8px;display:flex;align-items:center;gap:4px;font:700 8px 'Segoe UI',sans-serif;letter-spacing:.6px}.score-badge svg{width:10px;height:10px}.score-badge.best{color:#ffd37f}.score-badge.recent{color:#8dcbf5}.card.best-card{border-left-color:#ffd37f;box-shadow:inset 0 0 0 1px #ffd37f66}.card.recent-card:not(.fc){border-left-color:#8dcbf5}.meta>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.if-fc{font-size:11px;font-weight:700;color:#ffdb91;background:#ffdb9126;border:1px solid #ffdb9155;border-radius:7px;padding:3px 7px;margin-top:3px;white-space:nowrap}.fc .if-fc{color:#97edc8;background:#97edc822;border-color:#97edc855}.compact .if-fc+.stamp{display:none}
</style>
<div class="overlay" id="box"><div class="head"><h1>osu! / SESSION TRACKER</h1><span><span class="dot" id="dot">●</span> <span id="time">00:00</span></span></div><div class="stats" id="stats"><div><div class="value" id="gain">—</div><div class="label" id="gainLabel">PROFILE PP</div></div><div><div class="value" id="fc">0</div><div class="label">FC</div></div><div><div class="value" id="plays">0</div><div class="label" id="playsLabel">PLAYS</div></div><div id="bestStat"><div class="value" id="best">—</div><div class="label" id="bestLabel">BEST PP</div></div></div><section id="bestSection"><div class="section-title best-heading"><svg aria-hidden="true" fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512"><path d="M316.9 18C311.6 7 300.4 0 288.1 0s-23.4 7-28.8 18L195 150.3 51.4 171.5c-12 1.8-22 10.2-25.7 21.7s-.7 24.2 7.9 32.7L137.8 329 113.2 474.7c-2 12 3 24.2 12.9 31.3s23 8 33.8 2.3l128.3-68.5 128.3 68.5c10.8 5.7 23.9 4.9 33.8-2.3s14.9-19.3 12.9-31.3L438.5 329 542.7 225.9c8.6-8.5 11.7-21.2 7.9-32.7s-13.7-19.9-25.7-21.7L381.2 150.3 316.9 18z"/></svg><span class="section-pill">BEST</span><span id="bestTag">SESSION BEST</span></div><div id="bestCard"></div></section><section id="recentSection"><div class="section-title recent-heading"><svg aria-hidden="true" fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M75 75L41 41C25.9 25.9 0 36.6 0 57.9L0 168c0 13.3 10.7 24 24 24l110.1 0c21.4 0 32.1-25.9 17-41l-30.8-30.8C155 85.5 203 64 256 64c106 0 192 86 192 192s-86 192-192 192c-40.8 0-78.6-12.7-109.7-34.4c-14.5-10.1-34.4-6.6-44.6 7.9s-6.6 34.4 7.9 44.6C151.2 495 201.7 512 256 512c141.4 0 256-114.6 256-256S397.4 0 256 0C185.3 0 121.3 28.7 75 75zm181 53c-13.3 0-24 10.7-24 24l0 104c0 6.4 2.5 12.5 7 17l72 72c9.4 9.4 24.6 9.4 33.9 0s9.4-24.6 0-33.9l-65-65 0-94.1c0-13.3-10.7-24-24-24z"/></svg><span class="section-pill">RECENT</span><span id="recentTag">RECENT SCORES</span></div><div id="recentCards"></div></section><div id="connection"></div></div>
<script>
const SCORE_ICONS={"best": "<svg aria-hidden=\"true\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 576 512\"><path d=\"M316.9 18C311.6 7 300.4 0 288.1 0s-23.4 7-28.8 18L195 150.3 51.4 171.5c-12 1.8-22 10.2-25.7 21.7s-.7 24.2 7.9 32.7L137.8 329 113.2 474.7c-2 12 3 24.2 12.9 31.3s23 8 33.8 2.3l128.3-68.5 128.3 68.5c10.8 5.7 23.9 4.9 33.8-2.3s14.9-19.3 12.9-31.3L438.5 329 542.7 225.9c8.6-8.5 11.7-21.2 7.9-32.7s-13.7-19.9-25.7-21.7L381.2 150.3 316.9 18z\"/></svg>", "recent": "<svg aria-hidden=\"true\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 512 512\"><path d=\"M75 75L41 41C25.9 25.9 0 36.6 0 57.9L0 168c0 13.3 10.7 24 24 24l110.1 0c21.4 0 32.1-25.9 17-41l-30.8-30.8C155 85.5 203 64 256 64c106 0 192 86 192 192s-86 192-192 192c-40.8 0-78.6-12.7-109.7-34.4c-14.5-10.1-34.4-6.6-44.6 7.9s-6.6 34.4 7.9 44.6C151.2 495 201.7 512 256 512c141.4 0 256-114.6 256-256S397.4 0 256 0C185.3 0 121.3 28.7 75 75zm181 53c-13.3 0-24 10.7-24 24l0 104c0 6.4 2.5 12.5 7 17l72 72c9.4 9.4 24.6 9.4 33.9 0s9.4-24.6 0-33.9l-65-65 0-94.1c0-13.3-10.7-24-24-24z\"/></svg>"};
const get=id=>document.getElementById(id),set=(id,v)=>get(id).textContent=v;
let lastBest='',lastRecent='',lastPreview='',initialized=false,previousKeys=new Set();
const key=p=>String(p.time)+'|'+String(p.map);
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function image(url,cls){const e=node('img',cls);e.src=url;e.alt='';e.addEventListener('error',()=>{e.hidden=true});return e}
function card(p,animate,animation,category){
 const e=node('article','card '+category+'-card'+(p.fc?' fc':'')+(animate&&animation!=='none'?' enter '+(['slide','fade','pop'].includes(animation)?animation:'slide'):''));
 if(/^\/image\/[a-f0-9]{32}$/.test(p.background||''))e.append(image(p.background,'cover'));
 e.append(node('div','shade'),node('div','rank'+(/^[XS]/.test(p.rank||'')?' gold':''),p.rank||'—'));
 const badge=node('div','score-badge '+category),icon=node('span','badge-icon');icon.innerHTML=SCORE_ICONS[category];badge.append(icon,node('span','',category==='best'?'BEST':'RECENT'));e.append(badge);
 const details=node('div','details');details.append(node('div','map',p.map||'—'));
 const meta=node('div','meta'),mods=node('span','mods');
 for(const m of (p.mods||[])){if(/^\/image\/[a-f0-9]{32}$/.test(m.image||'')){const img=image(m.image,'mod');img.alt=m.name;mods.append(img)}else mods.append(node('span','',m.name))}
 meta.append(mods,node('span','',(Number(p.rate)>0&&Math.abs(Number(p.rate)-1)>.001?Number(p.rate).toFixed(2)+'x · ':'')+(Number(p.stars)>0?Number(p.stars).toFixed(2)+' ★ · ':'')+Number(p.accuracy||0).toFixed(2)+'% · '+(p.combo||0)+'x'+(p.fc?' · FC':'')));
 details.append(meta,node('div','hits',p.hits||''));e.append(details);
 const pp=node('div','pp',Number(p.pp||0).toFixed(2));pp.append(node('small','',' pp'));if(Number(p.fcPp)>0)pp.append(node('div','if-fc','(if FC '+Number(p.fcPp).toFixed(2)+' pp)'));
 const date=new Date(p.time);pp.append(node('div','stamp',isNaN(date)?'':date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})));e.append(pp);return e;
}
function render(target,plays,ru,animate,animation){const rows=plays.map(p=>card(p,animate&&!previousKeys.has(key(p)),animation,target==='bestCard'?'best':'recent'));if(!rows.length)rows.push(node('div','empty',ru?'Ожидание скора…':'Waiting for a score…'));get(target).replaceChildren(...rows)}
async function refresh(){try{
 const response=await fetch('/state',{cache:'no-store'});if(!response.ok)throw Error();const s=await response.json(),ru=s.language==='ru';
 document.documentElement.lang=ru?'ru':'en';get('box').classList.remove('offline');get('box').style.setProperty('--accent',s.accent||'#ff9fc8');get('box').style.fontFamily=s.font||'Segoe UI';
 const size=['compact','normal','large'].includes(s.cardSize)?s.cardSize:'normal';get('box').classList.remove('compact','normal','large');get('box').classList.add(size);
 get('box').style.setProperty('--panel-width',Math.max(600,Math.min(1200,Number(s.width)||720))+'px');get('box').style.setProperty('--card-height',({compact:90,normal:110,large:145})[size]+'px');get('box').style.setProperty('--panel-opacity',s.opacity==null?.89:Math.max(0,Math.min(100,Number(s.opacity)))/100);get('stats').hidden=s.showStats===false;
 get('box').hidden=s.showStats===false&&s.showBest===false&&s.showRecent===false;
 const replay=!!s.preview&&s.previewToken!==lastPreview;if(replay){previousKeys=new Set();lastBest='';lastRecent='';lastPreview=s.previewToken;}
 set('gain',s.gain==null?'—':(s.gain>0?'+':'')+Number(s.gain).toFixed(2));set('fc',s.fc||0);set('plays',s.plays||0);set('best',s.bestPp==null?'—':Number(s.bestPp).toFixed(2));
 set('gainLabel',ru?'PP ПРОФИЛЯ':'PROFILE PP');set('playsLabel',ru?'ПРОХОЖДЕНИЯ':'PLAYS');set('bestLabel',ru?'ЛУЧШИЕ PP':'BEST PP');set('bestTag',ru?'ЛУЧШИЙ СКОР СЕССИИ':'SESSION BEST');set('recentTag',ru?'ПОСЛЕДНИЕ СКОРЫ':'RECENT SCORES');
 get('bestStat').hidden=get('bestSection').hidden=s.showBest===false;get('recentSection').hidden=s.showRecent===false;
 const best=s.best?[s.best]:[],recent=Array.isArray(s.recent)?s.recent.slice(0,5):[],b=JSON.stringify([best,ru]),r=JSON.stringify([recent,ru]);
 if(b!==lastBest){render('bestCard',best,ru,(initialized||s.preview)&&s.animate,s.animation);lastBest=b}if(r!==lastRecent){render('recentCards',recent,ru,(initialized||s.preview)&&s.animate,s.animation);lastRecent=r}
 previousKeys=new Set([...best,...recent].map(key));initialized=true;
 const sec=Math.max(0,Math.floor(s.seconds||0));set('time',[Math.floor(sec/3600),Math.floor(sec/60%60),sec%60].map(n=>String(n).padStart(2,'0')).join(':'));set('dot',s.ended?'■':'●');set('connection',s.preview?(ru?'ПРЕДПРОСМОТР · демо-данные · не показывается на стриме':'PREVIEW · demo data · not shown on stream'):s.ended?(ru?'Сессия завершена':'Session finished'):'');
 }catch{get('box').classList.add('offline');set('connection','Tracker offline / Трекер выключен')}finally{setTimeout(refresh,500)}}refresh();
</script></html>
